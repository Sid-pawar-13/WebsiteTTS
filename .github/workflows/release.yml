name: Validate and release WebsiteTTS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate extension and build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate manifest and required files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("manifest.json")
          manifest = json.loads(manifest_path.read_text())
          assert manifest.get("manifest_version") == 3, "Manifest V3 is required"
          assert manifest.get("version"), "Extension version is missing"

          required = [
              manifest["background"]["service_worker"],
              manifest["action"]["default_popup"],
              manifest["options_ui"]["page"],
              *manifest["content_scripts"][0]["js"],
          ]
          required += [
              "offscreen.html", "offscreen.js",
              "popup.css", "popup.js",
              "options.css", "options.js",
          ]
          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              raise SystemExit("Missing extension files: " + ", ".join(missing))
          print(f"Validated WebsiteTTS {manifest['version']} (Manifest V3)")
          PY

      - name: Check JavaScript syntax
        run: |
          for file in background.js content.js offscreen.js popup.js options.js; do
            node --check "$file"
          done

      - name: Build distributable ZIP
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          manifest = json.loads(Path("manifest.json").read_text())
          version = manifest["version"]
          files = [
              "manifest.json",
              "background.js",
              "offscreen.html",
              "offscreen.js",
              "popup.html",
              "popup.css",
              "popup.js",
              "options.html",
              "options.css",
              "options.js",
              "content.js",
              "README.md",
              "BROWSER_SUPPORT.md",
          ]
          missing = [name for name in files if not Path(name).is_file()]
          if missing:
              raise SystemExit("Cannot package; missing: " + ", ".join(missing))

          output = Path("dist") / f"WebsiteTTS-v{version}-chromium.zip"
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for name in files:
                  archive.write(name, arcname=name)
          print(f"Created {output}")
          PY
          cd dist
          sha256sum WebsiteTTS-*.zip > SHA256SUMS.txt

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: WebsiteTTS-chromium-package
          path: |
            dist/WebsiteTTS-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/WebsiteTTS-*.zip
            dist/SHA256SUMS.txt
