<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebsiteTTS</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
<header><h1>▶ WebsiteTTS</h1><p>Listen to this webpage</p></header>
<p id="status" aria-live="polite">Ready to read</p>
<section class="controls">
<button type="button" id="backward" title="Previous paragraph" aria-label="Previous paragraph">↶</button>
<button type="button" id="start" class="primary" title="Start reading" aria-label="Start reading">▶</button>
<button type="button" id="stop" title="Stop reading" aria-label="Stop reading">■</button>
<button type="button" id="forward" title="Next paragraph" aria-label="Next paragraph">↷</button>
</section>
<label for="rate">Reading speed <output id="rateValue">1.0×</output></label>
<input id="rate" type="range" min="0.7" max="2" step="0.1" value="1">
<details open><summary>TTS provider settings</summary>
<label for="provider">Provider</label>
<select id="provider"><option value="ollama">Ollama (local / Phonon)</option><option value="openai">OpenAI-compatible API</option></select>
<label for="endpoint">API base URL</label><input id="endpoint" type="text" spellcheck="false" placeholder="http://localhost:11434/v1">
<label for="model">TTS model</label><input id="model" type="text" spellcheck="false" placeholder="phonon">
<label for="voice">Voice</label><input id="voice" type="text" spellcheck="false" placeholder="default">
<div id="apiKeyGroup"><label for="apiKey">API key</label><input id="apiKey" type="password" autocomplete="off" placeholder="API key"></div>
<button type="button" id="save" class="save">Save settings</button>
<small id="settingsStatus" role="status" aria-live="polite">Choose a provider and save its settings.</small>
<small id="providerHelp" class="provider-help"></small>
</details>
<small>Forward and backward move one paragraph. The page scrolls to the highlighted text.</small>
<footer>Speech is generated by your selected TTS provider.</footer>
</main><script src="popup.js"></script></body></html>
