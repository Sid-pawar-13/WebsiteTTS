<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebsiteTTS</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div><h1>▶ WebsiteTTS</h1><p>Listen to this webpage</p></div>
      <button type="button" id="openSettings" class="settings-button" title="Open settings" aria-label="Open settings">⚙</button>
    </header>
    <p id="status" aria-live="polite">Ready to read</p>
    <section class="controls">
      <button type="button" id="backward" title="Previous paragraph" aria-label="Previous paragraph">↶</button>
      <button type="button" id="start" class="primary" title="Start reading" aria-label="Start reading">▶</button>
      <button type="button" id="stop" title="Stop reading" aria-label="Stop reading">■</button>
      <button type="button" id="forward" title="Next paragraph" aria-label="Next paragraph">↷</button>
    </section>
    <label for="rate">Reading speed <output id="rateValue">1.0×</output></label>
    <input id="rate" type="range" min="0.7" max="2" step="0.1" value="1">
    <button type="button" id="settingsLink" class="settings-link">⚙ Configure TTS provider and API</button>
    <small>Forward and backward move one paragraph. The page scrolls to the highlighted text.</small>
    <footer>Speech is generated by your selected TTS provider.</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
