<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebsiteTTS</title><link rel="stylesheet" href="popup.css"></head><body><main><header><h1>▶ WebsiteTTS</h1><p>Listen to this webpage</p></header><p id="status" aria-live="polite">Ready to read</p><section class="controls"><button id="backward" title="Previous paragraph">↶</button><button id="start" class="primary" title="Start reading">▶</button><button id="stop" title="Stop reading">■</button><button id="forward" title="Next paragraph">↷</button></section><label for="rate">Reading speed <output id="rateValue">1.0×</output></label><input id="rate" type="range" min="0.7" max="2" step="0.1" value="1"><small>Forward and backward move one paragraph. The page scrolls to the highlighted text.</small><footer>Uses your browser's built-in voice</footer></main><script src="popup.js"></script></body></html>
